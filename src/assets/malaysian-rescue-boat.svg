<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <filter id="boat-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.2" flood-color="#0F172A" flood-opacity="0.38" />
    </filter>
    <linearGradient id="orange-hull" x1="16" y1="8" x2="48" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FB923C" />
      <stop offset="50%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#C2410C" />
    </linearGradient>
    <linearGradient id="deck-floor" x1="24" y1="16" x2="40" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
  </defs>

  <g filter="url(#boat-shadow)">
    <!-- Outer Black Heavy-Duty Rub Strake -->
    <path
      d="M32 4C40.5 4 48 13.5 49 26.5L49.5 48.5C49.5 51.2 47.4 53.2 44.8 53.2H19.2C16.6 53.2 14.5 51.2 14.5 48.5L15 26.5C16 13.5 23.5 4 32 4Z"
      fill="#0F172A"
    />

    <!-- Malaysian Orange Inflatable Pontoons -->
    <path
      d="M32 5.8C39.6 5.8 46.2 14.4 47.1 26.6L47.6 48C47.6 50.1 46 51.5 44 51.5H20C18 51.5 16.4 50.1 16.4 48L16.9 26.6C17.8 14.4 24.4 5.8 32 5.8Z"
      fill="url(#orange-hull)"
    />

    <!-- High-Visibility White Rescue Stripes on Bow Shoulders -->
    <path d="M21 16.5L25.5 11.5L27.2 13L22.7 18Z" fill="#FFFFFF" opacity="0.92" />
    <path d="M43 16.5L38.5 11.5L36.8 13L41.3 18Z" fill="#FFFFFF" opacity="0.92" />

    <!-- Stern Pontoon End Cones -->
    <ellipse cx="20.2" cy="51.2" rx="3.4" ry="2.2" fill="#9A3412" />
    <ellipse cx="43.8" cy="51.2" rx="3.4" ry="2.2" fill="#9A3412" />

    <!-- Interior Deck Floor -->
    <path
      d="M32 13.5C36.8 13.5 40.6 19.6 41.2 28.2V46.8H22.8V28.2C23.4 19.6 27.2 13.5 32 13.5Z"
      fill="url(#deck-floor)"
      stroke="#0F172A"
      stroke-width="1.2"
    />

    <!-- Aluminum Thwart / Bench Seats -->
    <rect x="21.5" y="25" width="21" height="4.2" rx="1.2" fill="#CBD5E1" stroke="#475569" stroke-width="0.8" />
    <rect x="21.5" y="36.5" width="21" height="4.2" rx="1.2" fill="#CBD5E1" stroke="#475569" stroke-width="0.8" />

    <!-- Bow Grab Rope & Rescue Lifebuoy -->
    <path d="M23 15.5C25.8 12.2 28.8 10.6 32 10.6C35.2 10.6 38.2 12.2 41 15.5" stroke="#F8FAFC" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="2.2 1.8" />
    <circle cx="32" cy="18.2" r="3.4" stroke="#F97316" stroke-width="2" fill="#1E293B" />
    <path d="M32 14.8V16.2M32 20.2V21.6M28.6 18.2H30M34 18.2H35.4" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" />

    <!-- Stern Transom Plate -->
    <rect x="23" y="46.4" width="18" height="3.2" rx="0.8" fill="#475569" stroke="#0F172A" stroke-width="0.8" />

    <!-- Outboard Motor -->
    <rect x="28.2" y="49" width="7.6" height="9.2" rx="2.2" fill="#111827" stroke="#E2E8F0" stroke-width="0.8" />
    <rect x="29.8" y="51" width="4.4" height="3.5" rx="0.8" fill="#DC2626" />
    <rect x="30.8" y="58.2" width="2.4" height="2.6" rx="0.6" fill="#475569" />
  </g>
</svg>
